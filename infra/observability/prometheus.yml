# Prometheus scrape configuration for noyeet.
#
# The target performs live work on every scrape: two guard simulations through KeeperHub
# against the deployed contract. Scraping faster than 30s would spend upstream quota for no
# extra signal, since a guard's health does not change between blocks.
global:
  scrape_interval: 30s
  scrape_timeout: 20s
  external_labels:
    service: noyeet

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/rules/slo.yml

# Threshold alerts say what is broken now; the SLO rules say whether the reliability budget
# is being spent faster than it can be afforded. Alertmanager decides who hears either.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: noyeet-dashboard
    metrics_path: /api/metrics
    scheme: https
    static_configs:
      - targets:
          - dashboard-nu-two-93.vercel.app
        labels:
          deployment: vercel
          chain: sepolia

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # The gateway is a long-running service on the host, scraped at the same interval as the
  # dashboard. Its /metrics does no upstream work, so it could be scraped faster; matching
  # the global interval keeps the two series aligned for joins.
  - job_name: noyeet-gateway
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          deployment: local
          chain: sepolia

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets:
          - redpanda:9644
